name: Deploy to Netlify

on:
  push:
    branches: [ main ]

jobs:
  netlify-deploy:
    runs-on: ubuntu-latest
    env:
      SITE_NAME: iltalinvibes
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Install Netlify CLI & jq
        run: |
          npm install -g netlify-cli
          sudo apt-get update && sudo apt-get install -y jq

      - name: Ensure Netlify site exists
        id: ensure_site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          SITE_NAME: ${{ env.SITE_NAME }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -n "$NETLIFY_SITE_ID" ]; then
            echo "site_id=$NETLIFY_SITE_ID" >> $GITHUB_OUTPUT
            echo "Using provided NETLIFY_SITE_ID"
          else
            echo "Checking for existing site with name $SITE_NAME"
            SITE=$(npx netlify api --auth "$NETLIFY_AUTH_TOKEN" "sites?filter[name]=$SITE_NAME" | jq -r '.[0].id // empty')
            if [ -n "$SITE" ]; then
              echo "site_id=$SITE" >> $GITHUB_OUTPUT
              echo "Found existing site: $SITE"
            else
              echo "Creating site '$SITE_NAME'..."
              SITE=$(npx netlify sites:create $SITE_NAME --auth "$NETLIFY_AUTH_TOKEN" --json | jq -r '.id')
              echo "site_id=$SITE" >> $GITHUB_OUTPUT
              echo "Created site: $SITE"
            fi
          fi

      - name: Netlify build (uses @netlify/plugin-nextjs)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: npx netlify build

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          SITE_ID=${{ steps.ensure_site.outputs.site_id }}
          if [ -z "$SITE_ID" ]; then
            echo "No SITE_ID found, aborting deploy" && exit 1
          fi
          npx netlify deploy --prod --dir=.netlify/output --site "$SITE_ID" --auth "$NETLIFY_AUTH_TOKEN"

      - name: Print site url
        run: |
          SITE_ID=${{ steps.ensure_site.outputs.site_id }}
          npx netlify api --auth "$NETLIFY_AUTH_TOKEN" "/sites/$SITE_ID" | jq -r '.url' || true
